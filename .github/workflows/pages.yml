# Publishes the portfolio on GitHub Pages at https://<owner>.github.io/<repository>/
# One-time setup in the repository: Settings > Pages > Build and deployment > Source: GitHub Actions
name: Publish on GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: One page per address, so links to a project open directly
        run: |
          for page in about oltre-la-teca oltre-lascolto sovrapposizioni marco-magnani-art crossing-kyiv brera-district a-drop-of-corruption; do
            mkdir -p "dist/$page"
            cp dist/index.html "dist/$page/index.html"
          done
          cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
